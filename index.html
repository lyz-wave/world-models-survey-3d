<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./world-models-3d/">
  <title>世界模型前沿架构 3D 深度对比 | LeCun H-JEPA vs 李飞飞 Atlas</title>
  <script>
    window.location.replace("./world-models-3d/");
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #070d14;
      color: #e4f3ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .loader-card {
      background: rgba(14, 25, 38, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 480px;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
    }
    h2 {
      font-size: 20px;
      margin: 0 0 12px;
      color: #00f2fe;
    }
    p {
      color: #8faec4;
      font-size: 14px;
      margin: 0 0 20px;
      line-height: 1.6;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 3px solid rgba(0, 242, 254, 0.15);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #04090f;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <h2>正在载入 3D 世界模型空间架构…</h2>
    <p>正在进入 Yann LeCun H-JEPA vs 李飞飞 Atlas 双架构深度对比交互平台。</p>
    <a class="btn" href="./world-models-3d/">直接进入 3D 平台 →</a>
  </div>
</body>
</html>
